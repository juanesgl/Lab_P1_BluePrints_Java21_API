services:
  db:
    image: postgres:17-alpine
    container_name: LAB4_ARSW-POSTGRES
    environment:
      POSTGRES_DB: lab4_arsw
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: chefai?
    ports:
      - "5432:5432"
    volumes:
      - postgres_storage:/var/lib/postgresql/data
volumes:
  postgres_storage: